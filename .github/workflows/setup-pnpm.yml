name: Setup pnpm
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        major: [9, 10, 11, 12]
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s actions/setup-pnpm -p 'test_*.py' -v
      - name: Declare an older exact patch
        env:
          MAJOR: ${{ matrix.major }}
        run: printf '{"packageManager":"pnpm@%s.0.0"}\n' "$MAJOR" > package.json
      - uses: ./actions/setup-pnpm
        with:
          version: ${{ matrix.major }}
      - name: Verify major selection and store access
        env:
          MAJOR: ${{ matrix.major }}
        run: |
          version=$(pnpm --version)
          test "${version%%.*}" = "$MAJOR"
          test "$version" != "$MAJOR.0.0"
          pnpm store path --silent
  scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Analyze and enforce quality gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_SCANNER_JAVA_OPTS: -Xmx1024m
          LANG: C.UTF-8
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 -Dsonar.javascript.node.maxspace=3072
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install linter
        run: python -m pip install ruff==0.14.5
      - name: Lint Python tooling
        run: ruff check --select E9,F63,F7,F82 actions
  build:
    name: Compile Python tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q actions
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
